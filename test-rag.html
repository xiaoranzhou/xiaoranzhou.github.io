<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Test - Local</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
    .test-result { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 8px; }
    .pass { border-left: 4px solid #4caf50; }
    .fail { border-left: 4px solid #f44336; }
    .query { font-weight: bold; color: #333; }
    .result { margin-top: 8px; font-family: monospace; font-size: 14px; }
    button { background: #2196f3; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; }
    button:hover { background: #1976d2; }
  </style>
</head>
<body>
  <h1>🧪 RAG System Test (Local)</h1>
  <button onclick="runAllTests()">Run All Tests</button>
  <div id="results"></div>

  <!-- JSONata 2.x -->
  <script src="https://cdn.jsdelivr.net/npm/jsonata@2.0.5/jsonata.min.js"></script>

  <!-- Knowledge Base -->
  <script>
    const KNOWLEDGE_BASE = {
      institutions: [
        {
          id: "ibg-3",
          name: "IBG-3: Agrosphere",
          aliases: ["ibg3", "ibg 3", "ibg-3", "agrosphere"],
          description: "Institute of Bio- and Geosciences - Agrosphere",
          focus: "Sustainable use of soil, water, atmosphere resources",
          research_areas: ["Soil-plant-atmosphere exchange processes"],
          url: "https://www.fz-juelich.de/en/institutes/ibg/agrosphere-ibg-3"
        },
        {
          id: "ibg-4",
          name: "IBG-4: Bioinformatics",
          aliases: ["ibg4", "ibg 4", "ibg-4", "bioinformatics"],
          description: "Institute of Bio- and Geosciences - Bioinformatics",
          focus: "Development of methods and algorithms for bioinformatics",
          research_areas: ["Knowledge management and data integration"],
          url: "https://www.fz-juelich.de/en/ibg/ibg-4"
        }
      ],
      projects: [
        {
          id: "dataplan",
          name: "DataPLAN",
          aliases: ["dataplan", "dmp", "data management plan"],
          description: "LLM-powered data management plan generator",
          publication: "Data 2023, DOI: 10.3390/data8110159",
          url: "https://plan.nfdi4plants.org"
        },
        {
          id: "elab2arc",
          name: "elab2arc",
          aliases: ["elab2arc", "protocol conversion"],
          description: "Converts free-text protocols to ARC-compliant Excel files",
          url: "https://github.com/nfdi4plants/elab2arc"
        }
      ],
      publications: [
        {
          id: "zhou2022",
          title: "CPlantBox: a whole-plant modelling framework",
          journal: "in silico Plants",
          year: "2022",
          aliases: ["cplantbox", "plant modeling"]
        }
      ]
    };
  </script>

  <script>
    // Test cases
    const testCases = [
      { query: "What is IBG-4?", expected: "ibg-4", description: "Should find IBG-4 Bioinformatics" },
      { query: "Tell me about IBG-3", expected: "ibg-3", description: "Should find IBG-3 Agrosphere" },
      { query: "What is DataPLAN?", expected: "dataplan", description: "Should find DataPLAN project" },
      { query: "Tell me about elab2arc", expected: "elab2arc", description: "Should find elab2arc project" },
      { query: "What is CPlantBox?", expected: "zhou2022", description: "Should find CPlantBox publication" },
      { query: "Tell me about bioinformatics", expected: "ibg-4", description: "Should match bioinformatics alias" },
      { query: "What is Xiaoran's favorite color?", expected: null, description: "Should return no results" }
    ];

    // Query knowledge base using JSONata
    function queryKnowledgeBase(userMessage, kb) {
      const messageLower = userMessage.toLowerCase();

      try {
        const expression = jsonata(`
          $append(
            $append(
              $$.institutions[$aliases[ $contains($lowercase(userMessage), $) ]],
              $$.projects[$aliases[ $contains($lowercase(userMessage), $) ]]
            ),
            $$.publications[$aliases[ $contains($lowercase(userMessage), $) ]]
          )
        `);

        expression.bind('userMessage', messageLower);
        const results = expression.evaluate(kb);

        return results && results.length > 0 ? results : null;
      } catch (error) {
        console.error('JSONata error:', error);
        return null;
      }
    }

    // Format results for display
    function formatResult(results) {
      if (!results || results.length === 0) return "No matches found";

      return results.map(r => {
        let text = r.name || r.title;
        if (r.description) text += ` - ${r.description}`;
        if (r.focus) text += ` [Focus: ${r.focus}]`;
        return text;
      }).join('\n');
    }

    // Run all tests
    function runAllTests() {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '<h2>Test Results:</h2>';

      let passed = 0;
      let failed = 0;

      testCases.forEach((test, index) => {
        const results = queryKnowledgeBase(test.query, KNOWLEDGE_BASE);
        const hasExpected = results && results.some(r => r.id === test.expected);
        const success = test.expected === null ? !results : hasExpected;

        const resultClass = success ? 'pass' : 'fail';
        const resultText = success ? '✅ PASS' : '❌ FAIL';

        if (success) passed++; else failed++;

        const html = `
          <div class="test-result ${resultClass}">
            <div class="query">Test ${index + 1}: ${test.query}</div>
            <div>${test.description}</div>
            <div class="result">${resultText} | Expected: ${test.expected || 'none'} | Got: ${results ? results.map(r => r.id).join(', ') : 'none'}</div>
            <div class="result">${formatResult(results)}</div>
          </div>
        `;
        resultsDiv.innerHTML += html;
      });

      // Summary
      resultsDiv.innerHTML += `
        <div class="test-result ${failed === 0 ? 'pass' : 'fail'}">
          <h3>Summary: ${passed}/${testCases.length} tests passed</h3>
        </div>
      `;
    }

    // Auto-run on page load
    window.addEventListener('load', runAllTests);
  </script>
</body>
</html>
